# SonarCloud automatic analysis settings.
# This file only adds issue exclusions: it does not set sonar.sources, sonar.exclusions or any
# other key that changes what is analyzed.
#
# plsql:VarcharUsageCheck ("Use VARCHAR2 instead of VARCHAR") is a false positive for the
# PostgreSQL Flyway migrations: SonarCloud reads every .sql file as PL/SQL (Oracle), but
# PostgreSQL has no VARCHAR2 type, so VARCHAR is the correct type there. Every other .sql file
# is outside db/migration/postgres and keeps the rule.
# If automatic analysis ignores this key, mark the issues as false positive in the SonarCloud UI.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=**/db/migration/postgres/**
