[project]
name = "vortex-kill-switch"
version = "0.1.1"
description = "Cloud Run function that unlinks billing from the Vortex ingestion project when its budget reports too much spend"
license = "Apache-2.0"
# The function runs on python312, the same minor as the pipeline
requires-python = ">=3.12,<3.13"
dependencies = [
    "functions-framework==3.10.2",
    "google-cloud-billing==1.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

# Not a package: Cloud Run functions deploy main.py and requirements.txt from the folder root
[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# coverage.xml (ignored by data/.gitignore) is the report SonarCloud imports (sonar-project.properties)
addopts = ["--strict-markers", "--cov=main", "--cov-branch", "--cov-report=term-missing", "--cov-report=xml"]

[tool.coverage.report]
# Same floor as the pipeline: a new line ships with its test. Never lower it
fail_under = 100
