name: sonar

# SonarCloud CI-based analysis (ADR 0010). The build jobs hold no secret and hand classes, libraries and coverage
# reports to sonar-scan, the only job that sees SONAR_TOKEN and the only one that runs no build code.
# Every job runs on every pull request: the SonarCloud check is required, so it must never stay pending (ADR 0001).
# Pull requests from forks do not get the secret and fail the scan; Dependabot reads its own copy of SONAR_TOKEN.

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  # One group per PR (newer pushes cancel older runs); one group per commit on master (no push is ever cancelled)
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  sonar-java-app:
    name: sonar-java-app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: backend/vortex-application-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: backend/vortex-application-service/pom.xml
      - name: Build, test and copy the dependencies
        timeout-minutes: 15
        # copy-dependencies fills target/dependency (every scope), read as sonar.java.libraries
        run: |
          ./mvnw -B -ntp verify dependency:copy-dependencies
          test -s target/site/jacoco/jacoco.xml || { echo '::error::target/site/jacoco/jacoco.xml is missing'; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-java-app
          # The common prefix (backend/vortex-application-service/target) is dropped; sonar-scan downloads back into it
          path: |
            backend/vortex-application-service/target/classes/
            backend/vortex-application-service/target/test-classes/
            backend/vortex-application-service/target/dependency/
            backend/vortex-application-service/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 3

  sonar-java-auth:
    name: sonar-java-auth
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: backend/vortex-authorization-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: backend/vortex-authorization-service/pom.xml
      - name: Build, test and copy the dependencies
        timeout-minutes: 15
        run: |
          ./mvnw -B -ntp verify dependency:copy-dependencies
          test -s target/site/jacoco/jacoco.xml || { echo '::error::target/site/jacoco/jacoco.xml is missing'; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-java-auth
          path: |
            backend/vortex-authorization-service/target/classes/
            backend/vortex-authorization-service/target/test-classes/
            backend/vortex-authorization-service/target/dependency/
            backend/vortex-authorization-service/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 3

  sonar-front-app:
    name: sonar-front-app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: frontend/vortex-application-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/vortex-application-service/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Unit tests with coverage
        # The lcov paths start at the repository root (projectRoot in vitest.config.ts)
        run: npx --no-install vitest run --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-front-app
          path: frontend/vortex-application-service/coverage/lcov.info
          if-no-files-found: error
          retention-days: 3

  sonar-front-auth:
    name: sonar-front-auth
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: frontend/vortex-authorization-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/vortex-authorization-service/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Unit tests with coverage
        # The lcov paths start at the repository root (projectRoot in vite.config.ts)
        run: npx --no-install vitest run --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-front-auth
          path: frontend/vortex-authorization-service/coverage/lcov.info
          if-no-files-found: error
          retention-days: 3

  sonar-data:
    name: sonar-data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: data/pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.12'
          working-directory: data/pipeline
          cache-dependency-glob: |
            data/pipeline/uv.lock
            data/kill-switch/uv.lock
      - name: Install dependencies
        # Same reasoning as data.yml: google-apitools ships only an sdist, pinned by hash in uv.lock
        run: uv sync --locked # NOSONAR githubactions:S8541, sdists pinned by hash in uv.lock (see data.yml)
      - name: Tests with coverage
        # addopts in pyproject.toml writes coverage.xml
        run: uv run --no-sync pytest
      - name: Kill-switch tests with coverage
        working-directory: data/kill-switch
        run: |
          uv sync --locked --no-build
          uv run --no-sync pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-data
          path: |
            data/pipeline/coverage.xml
            data/kill-switch/coverage.xml
          if-no-files-found: error
          retention-days: 3

  sonar-scan:
    name: sonar-scan
    needs: [sonar-java-app, sonar-java-auth, sonar-front-app, sonar-front-auth, sonar-data]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SCM blame dates each issue by its line's last commit, which keeps old code out of new code
          fetch-depth: 0
          persist-credentials: false
      # Downloaded into the same paths the build jobs uploaded from (the artifact drops their common prefix)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-java-app
          path: backend/vortex-application-service/target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-java-auth
          path: backend/vortex-authorization-service/target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-front-app
          path: frontend/vortex-application-service/coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-front-auth
          path: frontend/vortex-authorization-service/coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-data
          # The artifact keeps the two reports under their common root: pipeline/ and kill-switch/
          path: data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install the front dependencies for tsconfig resolution
        # The analyzer reads the tsconfig presets (@vue/tsconfig, @tsconfig/node26) from node_modules; no
        # dependency script runs, and SONAR_TOKEN is not in this step's environment
        run: |
          npm ci --ignore-scripts --prefix frontend/vortex-application-service
          npm ci --ignore-scripts --prefix frontend/vortex-authorization-service
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
