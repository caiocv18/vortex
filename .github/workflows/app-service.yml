name: app-service

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  # One group per PR (newer pushes cancel older runs); one group per commit on master (no push is ever cancelled)
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      # On pull_request the filter uses the API; on push it diffs against the previous commit with git
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - 'backend/vortex-application-service/**'
              - '.github/workflows/app-service.yml'

  app-service:
    name: app-service
    needs: changes
    # Fail closed: a skipped job reports success, so if the filter itself breaks, build anyway
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: backend/vortex-application-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: backend/vortex-application-service/pom.xml
      - name: Build, test and check coverage
        # Shorter than the job timeout, so the summary and the reports still run after a hang
        timeout-minutes: 15
        run: |
          ./mvnw -B -ntp verify
          test -s target/jacoco.exec || { echo '::error::target/jacoco.exec is missing, so jacoco:check was skipped'; exit 1; }
      - name: Write coverage summary
        if: ${{ !cancelled() }}
        run: |
          # The last <counter> of each type in jacoco.xml is the report total, the same number jacoco:check compares
          report=target/site/jacoco/jacoco.xml
          floor=$(sed -n 's:.*<jacoco.line.minimum>\(.*\)</jacoco.line.minimum>.*:\1:p' pom.xml)
          {
            echo '### app-service coverage'
            echo
            if [ -f "$report" ]; then
              echo '| Counter | Covered | Total | Ratio |'
              echo '|---|---:|---:|---:|'
              for pair in LINE:Lines BRANCH:Branches; do
                grep -o "<counter type=\"${pair%%:*}\"[^>]*/>" "$report" | tail -n 1 |
                  sed 's/.*missed="\([0-9]*\)" covered="\([0-9]*\)".*/\1 \2/' |
                  awk -v label="${pair##*:}" '{ t = $1 + $2; printf "| %s | %d | %d | %.1f%% |\n", label, $2, t, t ? 100 * $2 / t : 0 }'
              done
              echo
              awk -v f="$floor" 'BEGIN { printf "Line floor: %.0f%% (`jacoco.line.minimum` = %s)\n", 100 * f, f }'
            else
              echo 'No JaCoCo report: the build stopped before the tests finished.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage and test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-service-reports
          # Action inputs do not inherit defaults.run.working-directory, so paths start at the repo root
          path: |
            backend/vortex-application-service/target/site/jacoco/
            backend/vortex-application-service/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  coverage-badge:
    name: coverage-badge
    needs: app-service
    # Only after a green build of a push to master; the SVG lives on the orphan "badges" branch, never on master
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.app-service.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job that can write to the repository, so it runs no third-party code: GitHub's own
    # actions fetch the files, and the shell below draws the SVG
    permissions:
      contents: write
    concurrency:
      # One badge push at a time, so two master runs never race on the badges branch. A third run
      # waiting behind a pending one cancels it; the guard below keeps the newest commit's badge
      # anyway. GitHub's "queue: max" would keep both, but actionlint 1.7.12 rejects it (rhysd/actionlint#654)
      group: ${{ github.workflow }}-coverage-badge
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-service-reports
          path: reports
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: badges
          path: badges
          persist-credentials: false
      - name: Draw and push the badge
        working-directory: badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A late run, or a re-run of an old commit, never replaces the badge of a newer commit
          prev=$(cat app-service/source-sha 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$prev" != "$GITHUB_SHA" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_SHA" --jq .status 2>/dev/null || echo unknown)
            if [ "$status" = behind ]; then
              echo "The badge already shows ${prev::7}, which is newer than ${GITHUB_SHA::7}"
              exit 0
            fi
          fi

          # Instruction coverage (JaCoCo C0) over every class of jacoco.csv, truncated to a tenth
          read -r covered total <<< "$(awk -F, '
            NR == 1 { for (i = 1; i <= NF; i++) col[$i] = i; next }
            { missed += $col["INSTRUCTION_MISSED"]; hit += $col["INSTRUCTION_COVERED"] }
            END { print hit + 0, missed + hit }' ../reports/site/jacoco/jacoco.csv)"
          [ "${total:-0}" -gt 0 ] || { echo '::error::jacoco.csv has no instruction counts'; exit 1; }
          tenths=$(( 1000 * covered / total ))
          if [ "$tenths" -eq 1000 ]; then text='100%'; else text="$(( tenths / 10 )).$(( tenths % 10 ))%"; fi
          # Shields.io colours, in steps of 10 points from 60%
          if   [ "$tenths" -ge 1000 ]; then color='#4c1'
          elif [ "$tenths" -ge 900 ]; then color='#97ca00'
          elif [ "$tenths" -ge 800 ]; then color='#a4a61d'
          elif [ "$tenths" -ge 700 ]; then color='#dfb317'
          elif [ "$tenths" -ge 600 ]; then color='#fe7d37'
          else color='#e05d44'
          fi
          mkdir -p app-service
          cat > app-service/coverage.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="106" height="20" role="img" aria-label="coverage: ${text}">
          <title>coverage: ${text}</title>
          <linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
          <clipPath id="r"><rect width="106" height="20" rx="3" fill="#fff"/></clipPath>
          <g clip-path="url(#r)"><rect width="61" height="20" fill="#555"/><rect x="61" width="45" height="20" fill="${color}"/><rect width="106" height="20" fill="url(#s)"/></g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
          <text x="30.5" y="15" fill="#010101" fill-opacity=".3">coverage</text><text x="30.5" y="14">coverage</text>
          <text x="83.5" y="15" fill="#010101" fill-opacity=".3">${text}</text><text x="83.5" y="14">${text}</text>
          </g>
          </svg>
          SVG
          # The source commit changes on every new master commit, so the guard above always has the newest one
          printf '%s\n' "$GITHUB_SHA" > app-service/source-sha

          if [ -z "$(git status --porcelain)" ]; then
            echo 'The badge did not change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-service/coverage.svg app-service/source-sha
          git commit -m "app-service coverage: ${text} of instructions at ${GITHUB_SHA::7}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:badges
