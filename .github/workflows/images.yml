name: images

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    # Not a required check, so a paths filter in on: is safe here (ADR 0001 covers the required ones)
    paths:
      - 'backend/**'
      - '.github/workflows/images.yml'
  schedule:
    # Mondays at 06:17 UTC: rebuilds edge, so JRE and Alpine fixes land without a code change
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  # Pull requests: a newer push cancels the older run. master and tags never cancel a running publish;
  # a newer run only replaces a waiting one, so publishes never race and edge ends on the newest
  # commit. A re-run keeps its original commit, so re-running an older master run moves edge back
  # until the next push or the weekly rebuild: re-run only the newest one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-auth:
    name: package-auth
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The Quarkus Dockerfile copies a prebuilt target/quarkus-app, so Maven runs here, in a job that
    # holds no write token, and hands the result to the image jobs as an artifact
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: backend/vortex-authorization-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Maven cache, and no build cache in the image jobs: every job of a master run can write the
      # Actions cache, so a cache would let code from one job reach the published image. Each publish
      # starts from Maven Central and the base images only
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'
      - name: Package the Quarkus app
        run: ./mvnw -B -ntp package -DskipTests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-quarkus-app
          path: backend/vortex-authorization-service/target/quarkus-app/
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.service }})
    needs: package-auth
    # Pull requests only: proves both Dockerfiles on both platforms, without pushing anything
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            context: backend/vortex-application-service
            dockerfile: backend/vortex-application-service/Dockerfile
          - service: auth
            context: backend/vortex-authorization-service
            dockerfile: backend/vortex-authorization-service/src/main/docker/Dockerfile.jvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.service == 'auth'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auth-quarkus-app
          path: backend/vortex-authorization-service/target/quarkus-app
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build both platforms without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # A path context: the checkout, plus the auth artifact, instead of the action's default Git context
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false

  publish:
    name: publish (${{ matrix.service }})
    needs: package-auth
    # master (a push, the weekly schedule or a manual run) and release tags; never a pull request
    if: github.ref == 'refs/heads/master' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No build code runs on this host: the app's Maven runs inside a BuildKit container, which sees
    # neither the token nor the registry login, and the auth app arrives prebuilt from package-auth
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            image: vortex-application-service
            context: backend/vortex-application-service
            dockerfile: backend/vortex-application-service/Dockerfile
            description: Vortex inventory API (Spring Boot)
          - service: auth
            image: vortex-authorization-service
            context: backend/vortex-authorization-service
            dockerfile: backend/vortex-authorization-service/src/main/docker/Dockerfile.jvm
            description: Vortex sign-up, sign-in and token service (Quarkus)
    outputs:
      # A matrix job has a single set of outputs, so each leg fills only its own name; smoke-arm64 and
      # scan fail loudly if a digest comes through empty
      digest-app: ${{ matrix.service == 'app' && steps.build.outputs.digest || '' }}
      digest-auth: ${{ matrix.service == 'auth' && steps.build.outputs.digest || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.service == 'auth'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auth-quarkus-app
          path: backend/vortex-authorization-service/target/quarkus-app
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The index carries the annotations too: GHCR reads a multi-platform image's description there
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # edge follows master, schedule included; sha-<commit> marks each push that gets its own run
          # (a newer push replaces one still waiting); a vX.Y.Z tag adds X.Y.Z, X.Y and latest
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false

  smoke-arm64:
    name: smoke-arm64
    needs: publish
    # The app image on a real arm64 runner, the way the demo instance will run it
    if: ${{ !cancelled() && needs.publish.result != 'skipped' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Start the app on H2 and wait for /health
        env:
          DIGEST: ${{ needs.publish.outputs.digest-app }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/vortex-application-service
        run: |
          [ -n "$DIGEST" ] || { echo '::error::publish returned no digest for the app image'; exit 1; }
          image="$REPOSITORY@$DIGEST"
          machine=$(uname -m)
          [ "$machine" = aarch64 ] || { echo "::error::the runner is $machine, not aarch64"; exit 1; }
          docker pull --quiet "$image"
          arch=$(docker image inspect --format '{{.Architecture}}' "$image")
          [ "$arch" = arm64 ] || { echo "::error::the pulled image is $arch, not arm64"; exit 1; }
          docker run --detach --name app --publish 8080:8080 --env SPRING_PROFILES_ACTIVE=dev,leve "$image"
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/health; then
              echo
              echo "/health answered $SECONDS s after the step started, pull included"
              exit 0
            fi
            [ "$(docker inspect --format '{{.State.Running}}' app)" = true ] || { echo '::error::the container stopped'; exit 1; }
            sleep 2
          done
          echo '::error::/health did not answer within 180 s'
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs app || true

  scan:
    name: scan (${{ matrix.service }})
    needs: publish
    # Also after one failed leg, so the other image is still scanned
    if: ${{ !cancelled() && needs.publish.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Trivy is third-party code, so this job only reads packages; the SARIF upload has its own job
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            image: vortex-application-service
            digest: ${{ needs.publish.outputs.digest-app }}
          - service: auth
            image: vortex-authorization-service
            digest: ${{ needs.publish.outputs.digest-auth }}
    env:
      TRIVY_VERSION: 0.76.2
      # SHA-256 of trivy_0.76.2_Linux-64bit.tar.gz, checked against its cosign bundle (command in ADR 0004)
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the digest
        env:
          DIGEST: ${{ matrix.digest }}
          SERVICE: ${{ matrix.service }}
        run: '[ -n "$DIGEST" ] || { echo "::error::publish returned no digest for $SERVICE"; exit 1; }'
      # The login lands in ~/.docker/config.json for ghcr.io only; TRIVY_USERNAME would reach every
      # registry Trivy contacts, including the mirror it downloads its database from
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install Trivy
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Day of the database cache
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: Scan the arm64 image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ matrix.digest }}
          SARIF: trivy-${{ matrix.service }}.sarif
        # Reports only: findings go to the Security tab and never fail the run
        run: |
          trivy image --image-src remote --platform linux/arm64 \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --format sarif --output "$SARIF" --exit-code 0 "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          if-no-files-found: error
          retention-days: 7

  upload-sarif:
    name: upload-sarif (${{ matrix.service }})
    needs: scan
    # Each leg uploads its own category, so one failed scan never removes the other's results
    if: ${{ !cancelled() && needs.scan.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [app, auth]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-${{ matrix.service }}
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
