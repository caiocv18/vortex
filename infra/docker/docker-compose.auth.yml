# Serviço de autorização: PostgreSQL (usado em todos os modos do start-vortex.sh, que sobe só o
# auth-db), mais backend Quarkus e frontend React em container para quem quiser tudo no Docker.
# Sem "name:" de propósito: o projeto continua "docker" (nome da pasta) e o volume dos dados
# continua docker_auth-db-data.

services:
  # PostgreSQL Database for Auth Service
  auth-db:
    image: postgres:18.6-alpine
    container_name: vortex-auth-db
    # Enxuto para dev: buffers pequenos, poucas conexões e I/O síncrono
    # (o padrão do PG 18 sobe 3 workers de I/O).
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=30
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c io_method=sync
    environment:
      POSTGRES_DB: vortex_auth
      POSTGRES_USER: vortex_auth
      POSTGRES_PASSWORD: vortex_auth_password
      # A imagem alpine não traz o locale en_US.UTF-8; o provedor builtin do PG 17+ dispensa.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      # A partir do PG 18 a imagem oficial monta em /var/lib/postgresql (PGDATA por versão).
      - auth-db-data:/var/lib/postgresql
      - ./init-auth-db.sql:/docker-entrypoint-initdb.d/init-auth-db.sql:ro
    mem_limit: 256m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex_auth -d vortex_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vortex-auth-network

  # Quarkus Auth Backend
  auth-backend:
    build:
      context: ../../backend/vortex-authorization-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: vortex-auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      # Database Configuration (nomes lidos pelo application.properties)
      POSTGRES_DB_URL: jdbc:postgresql://auth-db:5432/vortex_auth
      POSTGRES_DB_USERNAME: vortex_auth
      POSTGRES_DB_PASSWORD: vortex_auth_password

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-vortex-super-secret-jwt-key-change-in-production}
      JWT_ISSUER: vortex-auth-service
      JWT_ACCESS_TOKEN_EXPIRATION: 15m
      JWT_REFRESH_TOKEN_EXPIRATION: 7d

      # CORS e proxies confiáveis (X-Forwarded-For só vale vindo deles)
      CORS_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:5173,http://localhost:4173"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,[::1],172.16.0.0/12}

      # Application Configuration
      QUARKUS_HTTP_PORT: 8081
      QUARKUS_LOG_LEVEL: INFO

      # Email Configuration (for password reset)
      AUTH_EMAIL_FROM: noreply@vortex.com

      # Rate Limiting
      AUTH_RATE_LIMIT_LOGIN_ATTEMPTS: 5
      AUTH_RATE_LIMIT_WINDOW_MINUTES: 15
      AUTH_RATE_LIMIT_LOCKOUT_MINUTES: 30

      # Kafka (perfil kafka): o broker do kafka-simple é "kafka" na rede vortex-simple
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}

      # RabbitMQ Configuration (optional)
      RABBITMQ_HOST: ${RABBITMQ_HOST:-localhost}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-vortex}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-vortex123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-vortex-vhost}
    ports:
      - "8081:8081"
    volumes:
      - ../../logs:/opt/app/logs
    mem_limit: 512m
    restart: "no"
    healthcheck:
      # A imagem (eclipse-temurin alpine) não tem curl; o wget do busybox serve
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/q/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - vortex-auth-network
      - vortex-simple

  # React Auth Frontend (VITE_API_URL é de build: vem do .env* do módulo, não daqui)
  auth-frontend:
    build:
      context: ../../frontend/vortex-authorization-service
      dockerfile: Dockerfile
    container_name: vortex-auth-frontend
    depends_on:
      - auth-backend
    ports:
      - "3001:80"
    mem_limit: 32m
    restart: "no"
    networks:
      - vortex-auth-network

volumes:
  auth-db-data:

networks:
  vortex-auth-network:
  vortex-simple:
    external: true