# Kafka completo (opcional): o mesmo broker nativo em KRaft de nó único do kafka-simple, mais os
# serviços da Confluent Platform 8.x (KRaft only, compatível com Kafka 4), cada um atrás de um
# profile para nunca subir por padrão:
#   ui              Kafka UI (kafbat)                http://localhost:8090
#   connect         Kafka Connect                    http://localhost:8083
#   schema-registry Schema Registry                  http://localhost:8085 (fora da 8081 do auth)
#   ksqldb          ksqlDB Server                    http://localhost:8088
#   tools           container com as CLIs do Kafka   docker exec -it vortex-kafka-tools bash
# Exemplo: docker compose -f infra/docker/docker-compose.kafka.yml --profile ui --profile schema-registry up -d
# Os dados do broker ficam na camada do container e somem no "down".
name: vortex-kafka

services:
  kafka:
    image: apache/kafka-native:4.4.0
    hostname: kafka
    container_name: vortex-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OPTS: "-Xmx256m"
    tmpfs:
      - /mnt/shared/config
      - /etc/kafka/secrets
    mem_limit: 384m
    restart: "no"
    networks:
      - vortex-kafka-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: vortex-kafka-ui
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vortex-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      # Schema Registry e Connect se cadastram pela própria UI (DYNAMIC_CONFIG_ENABLED),
      # quando os profiles deles estiverem de pé
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MaxRAMPercentage=50"
    mem_limit: 384m
    restart: "no"
    networks:
      - vortex-kafka-network

  kafka-connect:
    image: confluentinc/cp-kafka-connect:8.4.0
    hostname: kafka-connect
    container_name: vortex-kafka-connect
    profiles: ["connect"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:19092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: vortex-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_LOGGERS: org.reflections=ERROR
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 768m
    restart: "no"
    networks:
      - vortex-kafka-network

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.0
    hostname: schema-registry
    container_name: vortex-schema-registry
    profiles: ["schema-registry"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # 8081 é do serviço de autorização: no host o Schema Registry fica na 8085
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx256m"
    mem_limit: 512m
    restart: "no"
    networks:
      - vortex-kafka-network

  ksqldb-server:
    image: confluentinc/cp-ksqldb-server:8.4.0
    hostname: ksqldb-server
    container_name: vortex-ksqldb-server
    profiles: ["ksqldb"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      KSQL_CONFIG_DIR: "/etc/ksql"
      KSQL_BOOTSTRAP_SERVERS: "kafka:19092"
      KSQL_HOST_NAME: ksqldb-server
      KSQL_LISTENERS: "http://0.0.0.0:8088"
      KSQL_CACHE_MAX_BYTES_BUFFERING: 0
      # Endereços internos da rede: o Schema Registry continua na 8081 dentro do container
      KSQL_KSQL_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      KSQL_KSQL_CONNECT_URL: "http://kafka-connect:8083"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      KSQL_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 768m
    restart: "no"
    networks:
      - vortex-kafka-network

  kafka-tools:
    # A imagem nativa do broker não traz as CLIs; este container traz (kafka-topics,
    # kafka-console-producer, kafka-consumer-groups...). Ex.:
    #   docker exec vortex-kafka-tools kafka-topics --bootstrap-server kafka:19092 --list
    image: confluentinc/cp-kafka:8.4.0
    container_name: vortex-kafka-tools
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]
    environment:
      KAFKA_HEAP_OPTS: "-Xmx192m"
    mem_limit: 384m
    restart: "no"
    networks:
      - vortex-kafka-network

networks:
  # Criada pelo start-vortex.sh (ensure_docker_networks) ou por infra/scripts/start-kafka.sh
  vortex-kafka-network:
    external: true
