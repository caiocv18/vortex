# Stack prd completa com RabbitMQ integrado: Oracle Free + RabbitMQ + backend + frontend.
#   Backend:       http://localhost:8080
#   Frontend:      http://localhost:3000
#   RabbitMQ AMQP: localhost:5672 / Management UI: http://localhost:15672
# JWT_SECRET é obrigatório (export JWT_SECRET="$(openssl rand -base64 48)"), inclusive para o
# "down": o Compose interpola o arquivo inteiro. A chave pública do serviço de autorização
# (src/main/resources/jwt/publicKey.pem do módulo) precisa existir; o start-vortex.sh gera o par.
name: vortex-full-rabbitmq

services:
  # ================================
  # ORACLE DATABASE
  # ================================
  vortex-db:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    hostname: oracle-db
    container_name: vortex-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle_1234}
      APP_USER: vortex_user
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-vortex_password}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ../oracle/init:/container-entrypoint-initdb.d:ro
    # O teto de 2 GB do Oracle Free cobre só SGA + PGA: folga para processos de fundo e listener
    mem_limit: 3g
    restart: "no"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - vortex-network

  # ================================
  # RABBITMQ MESSAGE BROKER
  # ================================
  vortex-rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: rabbitmq
    container_name: vortex-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: vortex
      RABBITMQ_DEFAULT_PASS: vortex123
      RABBITMQ_DEFAULT_VHOST: vortex-vhost
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
      - ../rabbitmq/20-vortex.conf:/etc/rabbitmq/conf.d/20-vortex.conf:ro
    mem_limit: 256m
    restart: "no"
    networks:
      - vortex-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ================================
  # BACKEND APPLICATION
  # ================================
  vortex-app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: vortex-app
    depends_on:
      vortex-db:
        condition: service_healthy
      vortex-rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prd,rabbitmq}
      ORACLE_DB_URL: jdbc:oracle:thin:@//vortex-db:1521/FREEPDB1
      ORACLE_DB_USERNAME: vortex_user
      ORACLE_DB_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-vortex_password}
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET (32+ caracteres aleatórios, ex. openssl rand -base64 48) para o backend no perfil prd}"
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8081}
      # Chave pública do auth para o fallback do AuthServiceClient (montada abaixo)
      AUTH_JWT_PUBLIC_KEY_LOCATION: /app/keys/auth-public-key.pem
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-vortex-auth-service}

      # Message broker (lidos pelo application-rabbitmq.properties)
      MESSAGE_BROKER_TYPE: rabbitmq
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_HOST: vortex-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: vortex
      RABBITMQ_PASSWORD: vortex123
      RABBITMQ_VHOST: vortex-vhost

      # Logging
      LOGGING_LEVEL_BR_COM_VORTEX: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AMQP: INFO
      LOGGING_LEVEL_ROOT: INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ../../backend/vortex-application-service/logs:/app/logs
      - type: bind
        source: ../../backend/vortex-authorization-service/src/main/resources/jwt/publicKey.pem
        target: /app/keys/auth-public-key.pem
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 768m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - vortex-network

  # ================================
  # FRONTEND APPLICATION
  # ================================
  vortex-frontend:
    build:
      context: ../../frontend/vortex-application-service
      dockerfile: Dockerfile
    container_name: vortex-frontend
    depends_on:
      vortex-app:
        condition: service_healthy
    ports:
      - "3000:80"
    mem_limit: 32m
    restart: "no"
    networks:
      - vortex-network

volumes:
  oracle-data:
    name: vortex-oracle-data
  rabbitmq-data:
    driver: local
  rabbitmq-logs:
    driver: local

networks:
  vortex-network:
    driver: bridge
    name: vortex-network
