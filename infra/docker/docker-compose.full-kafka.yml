# Stack prd completa com Kafka integrado: Kafka nativo (KRaft) + Oracle Free + backend + frontend.
#   Backend:  http://localhost:8080
#   Frontend: http://localhost:3000
#   Kafka:    localhost:9092 (host) / kafka:19092 (rede vortex-network)
# Kafka UI só com o profile ui:
#   docker compose -f infra/docker/docker-compose.full-kafka.yml --profile ui up -d kafka-ui
name: vortex-full-kafka

services:
  # ================================
  # APACHE KAFKA (KRaft, sem ZooKeeper)
  # ================================
  kafka:
    image: apache/kafka-native:4.4.0
    hostname: kafka
    container_name: vortex-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OPTS: "-Xmx256m"
    tmpfs:
      - /mnt/shared/config
      - /etc/kafka/secrets
    mem_limit: 384m
    restart: "no"
    networks:
      - vortex-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: vortex-kafka-ui
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vortex-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MaxRAMPercentage=50"
    mem_limit: 384m
    restart: "no"
    networks:
      - vortex-network

  # ================================
  # DATABASE
  # ================================
  vortex-db:
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    container_name: vortex-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle_1234}
      APP_USER: vortex_user
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-vortex_password}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ../oracle/init:/container-entrypoint-initdb.d:ro
    mem_limit: 2g
    restart: "no"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - vortex-network

  # ================================
  # BACKEND APPLICATION
  # ================================
  vortex-app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: vortex-app
    depends_on:
      vortex-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prd,kafka}
      ORACLE_DB_URL: jdbc:oracle:thin:@//vortex-db:1521/FREEPDB1
      ORACLE_DB_USERNAME: vortex_user
      ORACLE_DB_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-vortex_password}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8081}
      LOGGING_LEVEL_BR_COM_VORTEX: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA: INFO
      LOGGING_LEVEL_ORG_APACHE_KAFKA: INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ../../backend/vortex-application-service/logs:/app/logs
    mem_limit: 768m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - vortex-network

  # ================================
  # FRONTEND APPLICATION
  # ================================
  vortex-frontend:
    build:
      context: ../../frontend/vortex-application-service
      dockerfile: Dockerfile
    container_name: vortex-frontend
    depends_on:
      vortex-app:
        condition: service_healthy
    ports:
      # O nginx do container escuta na 80
      - "3000:80"
    mem_limit: 32m
    restart: "no"
    networks:
      - vortex-network

volumes:
  oracle-data:
    name: vortex-oracle-data

networks:
  vortex-network:
    driver: bridge
    name: vortex-network
