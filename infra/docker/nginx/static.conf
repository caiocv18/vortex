# Servidor estático do modo leve do start-vortex.sh (container vortex-static).
# Serve os dist/ já compilados dos dois frontends, nas mesmas portas do Vite dev server:
#   5173 -> frontend principal (Vue)          root /srv/app
#   3001 -> frontend de autorização (React)   root /srv/auth
# Sem proxy de /api/: o navegador chama os backends direto em http://localhost:8080 e :8081
# (as URLs entram no build pelos VITE_*). O nginx.conf de cada frontend faz proxy para um host
# vortex-app que não existe no modo leve, e com ele o nginx nem sobe.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/xml text/javascript application/javascript
           application/json application/xml application/manifest+json image/svg+xml;

server_tokens off;

server {
    listen 5173;
    server_name _;
    root /srv/app;
    index index.html;

    # Assets com hash no nome (Vite): cache longo e imutável
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalidado, para pegar o build novo na hora
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Arquivos ocultos (ex.: o .vortex-build do launcher) não são servidos
    location ~ /\. {
        return 404;
    }

    # SPA: rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 3001;
    server_name _;
    root /srv/auth;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
