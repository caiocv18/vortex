# RabbitMQ usado pelo start-vortex.sh (-m rabbitmq).
#   AMQP:          localhost:5672 (vhost vortex-vhost, usuário vortex / vortex123)
#   Management UI: http://localhost:15672
# Container de ferramentas só com o profile tools:
#   docker compose -f infra/docker/docker-compose.rabbitmq.yml --profile tools up -d rabbitmq-tools
name: vortex-rabbitmq

services:
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: rabbitmq
    container_name: vortex-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: vortex
      RABBITMQ_DEFAULT_PASS: vortex123
      RABBITMQ_DEFAULT_VHOST: vortex-vhost
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
      # Teto de memória, disk_free_limit e nível de log (ver o arquivo)
      - ../rabbitmq/20-vortex.conf:/etc/rabbitmq/conf.d/20-vortex.conf:ro
    mem_limit: 256m
    restart: "no"
    networks:
      - vortex-rabbitmq-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  rabbitmq-tools:
    image: rabbitmq:4.4.0-management-alpine
    container_name: vortex-rabbitmq-tools
    profiles: ["tools"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    # Imagem alpine (busybox): tail no lugar de "sleep infinity" para ficar de pé
    command: ["tail", "-f", "/dev/null"]
    mem_limit: 128m
    restart: "no"
    networks:
      - vortex-rabbitmq-network

volumes:
  rabbitmq-data:
    driver: local
  rabbitmq-logs:
    driver: local

networks:
  # Criada pelo start-vortex.sh (ensure_docker_networks) ou por infra/scripts/start-rabbitmq.sh.
  # Precisa ser external: uma rede com esse nome criada fora do Compose faz o "up" falhar com
  # "network ... was found but has incorrect label".
  vortex-rabbitmq-network:
    external: true
