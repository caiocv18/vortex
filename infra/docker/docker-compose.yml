# Ambiente prd do start-vortex.sh: backend principal (Spring Boot, perfil prd) + Oracle Database Free.
# O docker-compose.override.yml desta pasta é aplicado junto quando nenhum -f é passado.
#   Oracle: localhost:1521, serviço FREEPDB1, usuário da aplicação vortex_user
# Os perfis e a mensageria vêm do launcher (SPRING_PROFILES_ACTIVE, KAFKA_ENABLED, RABBITMQ_ENABLED).
# O Kafka, quando usado, é o do docker-compose.kafka-simple.yml (rede vortex-simple); o RabbitMQ,
# o do docker-compose.rabbitmq.yml (rede vortex-rabbitmq-network).
#
# JWT_SECRET é obrigatório (o perfil prd recusa o segredo padrão). O Compose interpola o arquivo
# inteiro em todo comando, até no "up -d db" e no "down": exporte antes, por exemplo
#   export JWT_SECRET="$(openssl rand -base64 48)"
# A chave pública do serviço de autorização (backend/vortex-authorization-service/src/main/
# resources/jwt/publicKey.pem) precisa existir: o start-vortex.sh gera o par quando falta.
name: vortex-prd

services:
  db:
    # Oracle Database Free 23ai (gvenzl): sem login no registry da Oracle e banco já criado na
    # imagem (faststart). O teto de 2 GB do Oracle Free vale só para SGA + PGA; o container
    # também conta a memória privada dos processos de fundo e do listener, daí a folga no mem_limit.
    image: gvenzl/oracle-free:23.26.3-slim-faststart
    container_name: vortex-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle_1234}
      # Criado no PDB FREEPDB1 na primeira subida
      APP_USER: vortex_user
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-vortex_password}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Rodam só na primeira inicialização do banco, como SYS (ver infra/oracle/init)
      - ../oracle/init:/container-entrypoint-initdb.d:ro
    mem_limit: 3g
    restart: "no"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - vortex-net

  vortex:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: vortex-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prd}
      ORACLE_DB_URL: jdbc:oracle:thin:@//vortex-db:1521/FREEPDB1
      ORACLE_DB_USERNAME: vortex_user
      ORACLE_DB_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-vortex_password}
      # Segredo do jwt.secret: sem ele o perfil prd morre no SecurityConfigurationValidator.
      # Aqui o Compose já para com a mensagem abaixo, antes de criar qualquer container.
      JWT_SECRET: "${JWT_SECRET:?defina JWT_SECRET (32+ caracteres aleatórios, ex. openssl rand -base64 48) para o backend no perfil prd}"
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      # RabbitMQ (perfil rabbitmq): o broker do docker-compose.rabbitmq.yml pelo nome do container,
      # na rede vortex-rabbitmq-network. O launcher liga com RABBITMQ_ENABLED=true no -m rabbitmq.
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-false}
      RABBITMQ_HOST: vortex-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: vortex
      RABBITMQ_PASSWORD: vortex123
      RABBITMQ_VHOST: vortex-vhost
      # O serviço de autorização roda no host (start-vortex.sh), não neste projeto
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8081}
      # Chave pública do auth (montada abaixo, só leitura): com o auth fora, o fallback do
      # AuthServiceClient confere a assinatura RS256, o emissor e a validade do token com ela
      AUTH_JWT_PUBLIC_KEY_LOCATION: /app/keys/auth-public-key.pem
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-vortex-auth-service}
    volumes:
      # Sintaxe longa com create_host_path: false: se o arquivo faltar o "up" falha com o caminho,
      # em vez de o Docker criar uma pasta vazia (de root) no lugar da chave
      - type: bind
        source: ../../backend/vortex-authorization-service/src/main/resources/jwt/publicKey.pem
        target: /app/keys/auth-public-key.pem
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    mem_limit: 768m
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - vortex-net
      - vortex-simple
      - vortex-rabbitmq-network

volumes:
  oracle-data:
    # Nome fixo: o mesmo banco serve as stacks prd (docker-compose.yml, full, full-kafka, full-rabbitmq)
    name: vortex-oracle-data

networks:
  vortex-net:
  # As duas são criadas pelo start-vortex.sh (ensure_docker_networks)
  vortex-simple:
    external: true
  vortex-rabbitmq-network:
    external: true
