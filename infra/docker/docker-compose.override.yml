# Docker Compose override para desenvolvimento local
# Aplicado automaticamente junto com o docker-compose.yml desta pasta quando nenhum -f é passado.
# Permite personalizar configurações sem modificar o docker-compose.yml principal.
services:
  vortex:
    environment:
      # Perfil vem do launcher (SPRING_PROFILES_ACTIVE); o padrão é prd (Oracle).
      # Para H2 em vez de Oracle: SPRING_PROFILES_ACTIVE=dev
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prd}

      # Configurações de logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_VORTEX: DEBUG

      # Configurações JPA para debug (opcional)
      # SPRING_JPA_SHOW_SQL: true
      # SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true

    # Descomente para mapear portas diferentes
    # ports:
    #   - "8082:8080"

  db:
    # O Oracle Free usa AL32UTF8 por padrão e se limita a 2 GB de RAM.
    # Descomente para mapear portas diferentes
    # ports:
    #   - "1522:1521"
    environment:
      # Senha de SYS e SYSTEM (só vale na primeira inicialização do volume)
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle_1234}
