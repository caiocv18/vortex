# Ajustes do RabbitMQ 4.x para o container de dev (montado em /etc/rabbitmq/conf.d/,
# ao lado do 10-defaults.conf da imagem oficial).

# O container tem mem_limit de 256 MB, mas o RabbitMQ mede a RAM do host: sem um teto absoluto
# o alarme de memória nunca dispararia antes do OOM killer. 160 MiB deixa folga para o Erlang.
vm_memory_high_watermark.absolute = 167772160

# O antigo disk_free_limit de 2 GB bloqueava os publishers num disco de WSL com pouco espaço
# livre. 256 MB ainda protege o disco sem travar o ambiente de desenvolvimento.
disk_free_limit.absolute = 256MB

# Só erros de conexão no log (substitui o antigo log_levels via ERL_ARGS, que o 4.x não lê mais)
log.connection.level = error
