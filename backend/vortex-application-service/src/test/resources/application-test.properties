# Configuração do banco de dados H2 para testes
# Um banco em memória por contexto de teste: o Spring mantém vários contextos abertos na mesma JVM,
# e o nome fixo testdb era compartilhado entre eles, inclusive com o contexto do perfil padrão
# (BackendApplicationTests), que abre o mesmo testdb com outra senha e falhava com
# "Wrong user name or password".
spring.datasource.url=jdbc:h2:mem:vortex-test-${random.uuid}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração para carregar o script import-test.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Cache sem Redis nos testes, igual ao perfil dev
spring.cache.type=simple
