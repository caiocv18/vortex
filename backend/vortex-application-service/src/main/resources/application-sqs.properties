# ================================
# CONFIGURAÇÕES AMAZON SQS (Spring Cloud AWS 4 / AWS SDK v2)
# ================================

# Liga o SQS: SqsConfig, produtor, @SqsListener e a auto-configuração do Spring Cloud AWS
sqs.enabled=true

# Região (padrão us-east-1) e credenciais seguem o application.properties:
# AWS_REGION, AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY, ou a cadeia padrão do AWS SDK v2.
# Para LocalStack ou outro endpoint compatível:
# spring.cloud.aws.sqs.endpoint=http://localhost:4566

# Processamento assíncrono dos movimentos de estoque via fila (opcional)
sqs.processamento.assincrono.enabled=${SQS_PROCESSAMENTO_ASSINCRONO_ENABLED:false}
