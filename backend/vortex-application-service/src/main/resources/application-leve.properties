# ================================
# PERFIL LEVE (usar junto com dev: --spring.profiles.active=dev,leve)
# ================================
# Para rodar com pouca RAM, ex.: java -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=64m
#   -XX:MaxMetaspaceSize=192m -Xmx320m -jar backend.jar --spring.profiles.active=dev,leve
# Só ajustes baratos e seguros; Redis, Kafka, RabbitMQ e SQS já ficam desligados no dev.

# Pool de conexões pequeno (H2 em memória)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Tomcat com menos threads
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=50
server.tomcat.max-connections=200

# Sem JMX nem registro de MBeans do Tomcat
spring.jmx.enabled=false
server.tomcat.mbeanregistry.enabled=false

# Sem log de SQL (o dev liga show-sql e format_sql)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cache de planos de consulta do Hibernate menor (padrão 2048)
spring.jpa.properties.hibernate.query.plan_cache_max_size=256
