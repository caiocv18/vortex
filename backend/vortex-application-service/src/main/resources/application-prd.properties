# Oracle Database Configuration for Production
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@localhost:1521:ORCLCDB}
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_DB_USERNAME:system}
spring.datasource.password=${ORACLE_DB_PASSWORD:secure_oracle_password}

# JPA Configuration for Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Oracle specific properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable H2 console in production
spring.h2.console.enabled=false

# SQL Initialization - disable for Oracle as we'll use specific scripts
spring.sql.init.mode=never 