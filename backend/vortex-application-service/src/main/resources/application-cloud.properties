# ================================
# PERFIL CLOUD (demo pública na EC2)
# ================================
# Endurece a aplicação e conta como produção (DeploymentProfiles.isProduction): o validador exige um JWT_SECRET
# forte e o erro 500 volta sem detalhe interno. Não define banco: vem sempre com o postgres, depois dele.
#   SPRING_PROFILES_ACTIVE=cloud,postgres,sqs
# A cadeia de segurança do cloud (SecurityConfig) libera só o /health e exige token em /api/**; o resto é negado.

# Sem Swagger e sem /v3/api-docs; a documentação pública é o snapshot docs/application/openapi-backend.json
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Sem console do H2, mesmo que a base o ligue
spring.h2.console.enabled=false

# Origens de navegador com CORS. Vazio = nenhuma: a vitrine chama /api na própria origem, pelo nginx.
# O nome da variável não é VORTEX_CORS_ALLOWED_ORIGINS de propósito: essa seria a forma de ambiente da própria
# chave e trocaria a lista em qualquer perfil. Uma lista não vazia tem de trazer também a origem pública da demo
# (https://<host>): atrás do nginx que termina o TLS o backend vê http e trata o POST da própria página como
# chamada de outra origem.
vortex.cors.allowed-origins=${VORTEX_CLOUD_CORS_ORIGINS:}
