# DB_CLOSE_DELAY=-1: o banco em memória vive até a JVM sair, não até a última conexão fechar. Sem ele,
# quando o Hikari aposenta a única conexão do pool (max-lifetime; o perfil leve fica com minimum-idle=1),
# ele fecha a velha antes de abrir a nova, o H2 apaga o testdb e o schema e os dados do import.sql somem.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.cache.type=simple

# SQL Initialization - garantir que o import.sql seja executado
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
