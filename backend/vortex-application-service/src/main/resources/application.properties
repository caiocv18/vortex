spring.application.name=backend

# H2 Database Configuration
spring.datasource.url=${H2_DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${H2_DB_USERNAME:sa}
spring.datasource.password=${H2_DB_PASSWORD:}
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# AWS SQS Configuration (Spring Cloud AWS 4 / AWS SDK v2)
# Desligado por padrão; o perfil sqs liga. Com ele desligado nenhum bean SQS/AWS é criado.
sqs.enabled=${SQS_ENABLED:false}
spring.cloud.aws.sqs.enabled=${sqs.enabled}
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
# Credenciais: cadeia padrão do AWS SDK v2 (variáveis AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY,
# ~/.aws/credentials, perfil de instância). Para fixar: spring.cloud.aws.credentials.access-key/secret-key.

# SQS Queue Names
sqs.queue.movimento-estoque=vortex-movimento-estoque-queue
sqs.queue.notificacao-estoque=vortex-notificacao-estoque-queue
sqs.queue.auditoria=vortex-auditoria-queue

# SQS Dead Letter Queue
sqs.dlq.movimento-estoque=vortex-movimento-estoque-dlq
sqs.dlq.notificacao-estoque=vortex-notificacao-estoque-dlq
sqs.dlq.auditoria=vortex-auditoria-dlq

# SQS Processing Configuration
sqs.processamento.assincrono.enabled=false

# Auth Service Configuration
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# JWT Configuration for Main Service
jwt.secret=${JWT_SECRET:CHANGE_THIS_SECURE_SECRET_AT_LEAST_32_CHARS}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.auth-service.failure-rate-threshold=${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.auth-service.wait-duration-in-open-state=${CIRCUIT_BREAKER_WAIT_DURATION_OPEN_STATE:30s}
resilience4j.circuitbreaker.instances.auth-service.sliding-window-size=${CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.auth-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.auth-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.auth-service.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.auth-service.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.auth-service.writable-stack-trace-enabled=true

# Retry Configuration
resilience4j.retry.instances.auth-service.max-attempts=3
resilience4j.retry.instances.auth-service.wait-duration=1s
resilience4j.retry.instances.auth-service.enable-exponential-backoff=true
resilience4j.retry.instances.auth-service.exponential-backoff-multiplier=2
resilience4j.retry.instances.auth-service.retry-exceptions=java.util.concurrent.TimeoutException,java.net.ConnectException

# Time Limiter Configuration
resilience4j.timelimiter.instances.auth-service.timeout-duration=5s
resilience4j.timelimiter.instances.auth-service.cancel-running-future=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.jedis.pool.max-active=10
spring.data.redis.jedis.pool.max-idle=5
spring.data.redis.jedis.pool.min-idle=1

# Cache Configuration
spring.cache.type=redis
spring.cache.cache-names=produto-types,usuarios
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
