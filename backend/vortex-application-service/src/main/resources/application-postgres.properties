# ================================
# PERFIL POSTGRES (banco da nuvem; nada de Oracle aqui)
# ================================
# Composto com outros perfis, sempre DEPOIS deles, porque o último ganha:
#   nuvem (EC2):  SPRING_PROFILES_ACTIVE=cloud,postgres,sqs
#   WSL:          SPRING_PROFILES_ACTIVE=dev,postgres   (ou dev,leve,postgres)
# "postgres,dev" daria H2 de novo. PostgresProfilePropertiesTest garante que este arquivo sobrescreve
# toda chave de banco, JPA, inicialização e cache que o application-dev.properties define.
#
# Na nuvem o banco "vortex" mora na mesma instância PostgreSQL do serviço de autorização, num banco próprio.
# O Flyway não cria banco: o banco e o usuário são criados uma vez, fora da aplicação.

spring.datasource.url=${VORTEX_DB_URL:jdbc:postgresql://localhost:5432/vortex}
# Sobrescreve o org.h2.Driver da base
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${VORTEX_DB_USERNAME:vortex}
spring.datasource.password=${VORTEX_DB_PASSWORD:vortex}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}

# O console do H2 não serve para PostgreSQL
spring.h2.console.enabled=false

# Esquema e dados de exemplo versionados pelo Flyway (V1 cria, V2 semeia uma vez só); o Hibernate só confere.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgres
spring.jpa.hibernate.ddl-auto=validate
# A base adia a inicialização de dados para depois do JPA; com Flyway o JPA tem de esperar a migração
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Sem data.sql/schema.sql: quem semeia é o Flyway, e o import.sql do Hibernate só roda com create/create-drop
spring.sql.init.mode=never

# Sem Redis na nuvem
spring.cache.type=simple
