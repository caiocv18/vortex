# Test configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS AUTH
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Password policy for tests
auth.password.min-length=8
auth.password.max-length=128
auth.password.require-uppercase=true
auth.password.require-lowercase=true
auth.password.require-numbers=true
auth.password.require-special-chars=true
auth.password.special-chars=!@#$%^&*()_+-=[]{}|;:,.<>?

# JWT: par RSA só de teste em src/test/resources/jwt-test (ver o README.txt de lá). A suíte não
# lê as chaves reais de src/main/resources/jwt, que ficam fora do git; o JwtTestKeysTest confere
# que estes valores prevalecem sobre os do application.properties principal.
# O emissor gravado no token (auth.jwt.issuer) e o exigido na verificação (mp.jwt.verify.issuer)
# precisam ser o mesmo valor, como em produção (os dois vêm de JWT_ISSUER).
smallrye.jwt.sign.key.location=jwt-test/privateKey.pem
mp.jwt.verify.publickey.location=jwt-test/publicKey.pem
mp.jwt.verify.issuer=https://vortex-test.com
auth.jwt.issuer=https://vortex-test.com

# Cobertura: o quarkus-jacoco grava target/jacoco-quarkus.exec e o relatório e o gate saem do
# jacoco-maven-plugin (report e check), que também soma os testes sem @QuarkusTest. O relatório
# próprio do Quarkus sairia antes dessa soma, então fica desligado.
quarkus.jacoco.report=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."br.com.vortex.authorization".level=DEBUG

# Messaging: no perfil de teste o canal user-events não tem conector (ele só existe nos perfis
# kafka e rabbitmq), então Kafka e RabbitMQ não sobem e os eventos ficam desligados, como no
# padrão de produção. O EventsEnabledTestProfile liga os eventos com o conector em memória.
auth.event.enabled=false

# Disable dev services
quarkus.devservices.enabled=false
quarkus.kafka.devservices.enabled=false
quarkus.datasource.devservices.enabled=false

# Rate limiting: as chaves que o RateLimitService lê, com os mesmos valores do padrão de produção.
# Falhas mais antigas que window-minutes não contam; o LoginRateLimitTest prova isso gravando
# tentativas com attempted_at no passado, sem esperar a janela passar.
auth.rate-limit.login-attempts=5
auth.rate-limit.window-minutes=15
auth.rate-limit.lockout-minutes=30