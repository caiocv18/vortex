# Application Configuration
quarkus.application.name=vortex-authorization-service
quarkus.http.port=8081

# Proxy reverso: o Quarkus troca o endereço remoto da requisição pelo cliente do X-Forwarded-For
# só quando a conexão vem de um endereço de TRUSTED_PROXIES; de qualquer outro o cabeçalho é ignorado.
# Por padrão nenhum endereço é confiável. Nada no projeto faz proxy do login: o navegador fala direto
# com a porta 8081 (por loopback no leve e no dev, pelo gateway da bridge no compose), e confiar
# nesses endereços, como o padrão anterior fazia, deixava qualquer cliente escolher o próprio IP e
# fugir do limite por IP. A lista não pode ficar vazia (sem trusted-proxies o Quarkus confia em TODO
# endereço), então o padrão é 0.0.0.0/32, que nunca é origem de uma conexão TCP.
# Atrás de um proxy de verdade: TRUSTED_PROXIES com os IPs ou CIDRs dele, separados por vírgula. O
# Quarkus usa o primeiro valor do X-Forwarded-For, então o proxy deve sobrescrever o cabeçalho, não
# acrescentar a ele (no nginx, proxy_set_header X-Forwarded-For $remote_addr). Valor que não é IP
# literal é descartado no AuthResource. O Forwarded padrão (RFC 7239) fica desligado.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.allow-forwarded=false
quarkus.http.proxy.trusted-proxies=${TRUSTED_PROXIES:0.0.0.0/32}

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:5173,http://localhost:4173}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_DB_USERNAME:vortex_auth}
quarkus.datasource.password=${POSTGRES_DB_PASSWORD:secure_postgres_password}
quarkus.datasource.jdbc.url=${POSTGRES_DB_URL:jdbc:postgresql://localhost:5432/vortex_auth}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway Migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=auth
quarkus.flyway.create-schemas=true
quarkus.flyway.locations=classpath:db/migration

# Development Flyway Configuration
%dev.quarkus.flyway.validate-on-migrate=false

# JWT Configuration
# As chaves ficam fora de META-INF/resources: tudo ali é servido como arquivo estático
# (GET /privateKey.pem entregava a chave de assinatura). Ficam fora do git (*.pem): onde ficam e
# como gerar está no README do módulo, seção "Chaves RSA do JWT".
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:vortex-auth-service}
smallrye.jwt.sign.key.location=jwt/privateKey.pem

# Password Policy
auth.password.min-length=${AUTH_PASSWORD_MIN_LENGTH:8}
auth.password.max-length=${AUTH_PASSWORD_MAX_LENGTH:128}
auth.password.require-uppercase=${AUTH_PASSWORD_REQUIRE_UPPERCASE:true}
auth.password.require-lowercase=${AUTH_PASSWORD_REQUIRE_LOWERCASE:true}
auth.password.require-numbers=${AUTH_PASSWORD_REQUIRE_NUMBERS:true}
auth.password.require-special-chars=${AUTH_PASSWORD_REQUIRE_SPECIAL_CHARS:true}
auth.password.special-chars=${AUTH_PASSWORD_SPECIAL_CHARS:!@#$%^&*()_+-=[]{}|;:,.<>?}

# JWT Configuration
auth.jwt.secret=${JWT_SECRET:CHANGE_THIS_SECURE_SECRET_AT_LEAST_32_CHARS}
auth.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}
auth.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:7d}
auth.jwt.issuer=${JWT_ISSUER:vortex-auth-service}

# Rate Limiting
auth.rate-limit.login-attempts=${AUTH_RATE_LIMIT_LOGIN_ATTEMPTS:5}
auth.rate-limit.window-minutes=${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}
auth.rate-limit.lockout-minutes=${AUTH_RATE_LIMIT_LOCKOUT_MINUTES:30}

# Email Configuration
quarkus.mailer.from=${AUTH_EMAIL_FROM:noreply@vortex.com}
auth.email.reset-token-expiration=${AUTH_EMAIL_RESET_TOKEN_EXPIRATION:1h}

# Development Configuration
%dev.quarkus.datasource.jdbc.url=${POSTGRES_DB_URL:jdbc:postgresql://localhost:5432/vortex_auth}
%dev.quarkus.datasource.username=${POSTGRES_DB_USERNAME:vortex_auth}
%dev.quarkus.datasource.password=${POSTGRES_DB_PASSWORD:vortex_auth_password}
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."br.com.vortex.authorization".level=DEBUG
%dev.quarkus.kafka.devservices.enabled=false
%dev.quarkus.rabbitmq.devservices.enabled=false

# Modo leve (java -jar com -Dquarkus.profile=leve, pelo start-vortex.sh)
# Mesmo banco do dev, pool pequeno, sem log de SQL e com o mailer em modo mock.
%leve.quarkus.datasource.jdbc.url=${POSTGRES_DB_URL:jdbc:postgresql://localhost:5432/vortex_auth}
%leve.quarkus.datasource.username=${POSTGRES_DB_USERNAME:vortex_auth}
%leve.quarkus.datasource.password=${POSTGRES_DB_PASSWORD:vortex_auth_password}
%leve.quarkus.datasource.jdbc.max-size=5
%leve.quarkus.datasource.jdbc.min-size=1
%leve.quarkus.flyway.validate-on-migrate=false
%leve.quarkus.hibernate-orm.log.sql=false
%leve.quarkus.mailer.mock=true
%leve.quarkus.devservices.enabled=false
%leve.quarkus.log.category."br.com.vortex.authorization".level=INFO

# Test Configuration
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

# Health checks
quarkus.smallrye-health.openapi.included=true

# OpenAPI/Swagger
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
mp.openapi.extensions.smallrye.info.title=Vortex Authorization Service API
mp.openapi.extensions.smallrye.info.version=0.1.0
mp.openapi.extensions.smallrye.info.description=Authentication and authorization service for Vortex system

# Logging
quarkus.log.level=INFO
quarkus.log.category."br.com.vortex.authorization".level=DEBUG

# Messaging Configuration - Disabled for development
# To enable messaging, use profile -Dquarkus.profile=kafka or -Dquarkus.profile=rabbitmq
# mp.messaging.outgoing.user-events.connector=smallrye-in-memory
# mp.messaging.outgoing.user-events.merge=true

# Kafka Configuration Profile
%kafka.mp.messaging.outgoing.user-events.connector=smallrye-kafka
%kafka.mp.messaging.outgoing.user-events.topic=vortex-user-events
%kafka.mp.messaging.outgoing.user-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
%kafka.mp.messaging.outgoing.user-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
%kafka.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
%kafka.kafka.client.id=vortex-auth-service
# Produtor idempotente (sem evento duplicado quando o envio é repetido) exige acks=all: com acks=1 o
# kafka-clients recusa a configuração e o Quarkus não subia no perfil kafka (KafkaProfileProducerConfigTest)
%kafka.kafka.acks=all
%kafka.kafka.retries=3
%kafka.kafka.enable.idempotence=true

# RabbitMQ Configuration Profile
%rabbitmq.mp.messaging.outgoing.user-events.connector=smallrye-rabbitmq
%rabbitmq.mp.messaging.outgoing.user-events.exchange.name=vortex.user.events
%rabbitmq.mp.messaging.outgoing.user-events.exchange.type=topic
%rabbitmq.mp.messaging.outgoing.user-events.routing-key=user.auth.${auth.event.routing-key:all}
%rabbitmq.mp.messaging.outgoing.user-events.exchange.durable=true
%rabbitmq.rabbitmq-host=${RABBITMQ_HOST:localhost}
%rabbitmq.rabbitmq-port=${RABBITMQ_PORT:5672}
%rabbitmq.rabbitmq-username=${RABBITMQ_USERNAME:secure_rabbitmq_user}
%rabbitmq.rabbitmq-password=${RABBITMQ_PASSWORD:secure_rabbitmq_password}
%rabbitmq.rabbitmq-virtual-host=${RABBITMQ_VHOST:/}

# Event Configuration
auth.event.routing-key=${AUTH_EVENT_ROUTING_KEY:auth}
auth.event.enabled=${AUTH_EVENT_ENABLED:false}