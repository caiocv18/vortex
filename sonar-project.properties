# SonarCloud CI-based analysis (ADR 0010), read by the sonar-scan job of .github/workflows/sonar.yml.
# Automatic analysis is off: it ignored half of these keys and never indexed Java.

sonar.organization=caiocv18
sonar.projectKey=caiocv18_vortex
sonar.projectName=vortex
# The quality gate's new code is "previous version": bump this with the release version (CLAUDE.md, Governance)
sonar.projectVersion=0.1.1
sonar.sourceEncoding=UTF-8

# Scope. Images are excluded because the text and secrets sensors index every file under the sources and
# report binaries as an encoding problem. Sources and tests both start at the root; the test globs are excluded from the sources, so the two sets
# are disjoint (a file in both aborts the scan with "can't be indexed twice")
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  **/src/test/**,\
  **/e2e/**,\
  **/__tests__/**,\
  data/pipeline/tests/**,\
  data/kill-switch/tests/**
sonar.exclusions=\
  **/src/test/**,\
  **/e2e/**,\
  **/__tests__/**,\
  data/pipeline/tests/**,\
  data/kill-switch/tests/**,\
  **/node_modules/**,\
  **/target/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.venv/**,\
  frontend/vortex-application-service/src/api/generated/**,\
  docs/archive/**,\
  **/*.png,\
  **/*.ico,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.webp
sonar.test.exclusions=\
  **/node_modules/**,\
  **/target/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.venv/**

# Java: the two Maven services, compiled by the sonar-java-* jobs (target/dependency comes from
# dependency:copy-dependencies, test scope included)
sonar.java.source=27
sonar.java.binaries=\
  backend/vortex-application-service/target/classes,\
  backend/vortex-authorization-service/target/classes
sonar.java.test.binaries=\
  backend/vortex-application-service/target/test-classes,\
  backend/vortex-authorization-service/target/test-classes
sonar.java.libraries=backend/*/target/dependency/*.jar
sonar.java.test.libraries=backend/*/target/dependency/*.jar

# Coverage reports. The lcov paths are relative to the repository root (projectRoot in each vite/vitest config)
sonar.coverage.jacoco.xmlReportPaths=\
  backend/vortex-application-service/target/site/jacoco/jacoco.xml,\
  backend/vortex-authorization-service/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=\
  frontend/vortex-application-service/coverage/lcov.info,\
  frontend/vortex-authorization-service/coverage/lcov.info
sonar.python.coverage.reportPaths=data/pipeline/coverage.xml,data/kill-switch/coverage.xml
# Only what a unit test cannot reach: entry points, build and tool configuration, type declarations
sonar.coverage.exclusions=\
  **/src/main.ts,\
  **/src/main.tsx,\
  **/*.config.*,\
  **/vite-env.d.ts

# Language settings that automatic analysis did not accept
sonar.python.version=3.12
sonar.terraform.provider.aws.version=6.73

# No file is read as PL/SQL (ADR 0010, amendment). Every .sql in the repository is PostgreSQL (the Flyway
# migrations of both services, infra/docker/init-auth-db.sql) except infra/oracle/init/01-init-schema.sql,
# which holds only GRANTs. Read as Oracle they produced only false positives (plsql:VarcharUsageCheck,
# plsql:S1138) and the "Data Dictionary is not configured" warning. The suffix below matches no file
sonar.plsql.file.suffixes=.plsql-not-used
